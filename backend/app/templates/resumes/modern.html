<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ resume.title }}</title>
<style>
@page { size: {{ design_settings.page_size }}; margin: 16mm; }
* { box-sizing: border-box; }
body {
    margin: 0; background: #eef2f7; color: #263445;
    font: {{ design_settings.font_size }}px/1.6 {{ design_settings.font_family }}, sans-serif;
}
.resume {
    display: flex;
    flex-direction: column;
    width: {% if design_settings.page_size == "Letter" %}8.5in{% else %}210mm{% endif %};
    min-height: {% if design_settings.page_size == "Letter" %}11in{% else %}297mm{% endif %};
    margin: 25px auto;
    padding: 18mm; background: white;
    box-shadow: 0 2px 14px #00000018;
    border-top: 4px solid {{ design_settings.accent_color }};
}
.resume[data-layout="two-column"] {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    column-gap: 24px;
    align-content: start;
}
.resume-header {
    grid-column: 1 / -1;
    border-bottom: 3px solid {{ design_settings.accent_color }};
    padding-bottom: 16px;
}
h1 { color: #173b5e; font-size: 2.2em; margin: 0; }
.professional-title { color: {{ design_settings.accent_color }}; font-size: 1.2em; font-weight: bold; }
.contact { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 12px; font-size: 11px; }
a { color: {{ design_settings.accent_color }}; text-decoration: none; }
section { margin-top: {% if design_settings.spacing == "compact" %}12{% elif design_settings.spacing == "spacious" %}28{% else %}20{% endif %}px; min-width: 0; }
h2 {
    color: {{ design_settings.accent_color }}; font-size: 1.15em; text-transform: uppercase;
    letter-spacing: 1px; border-bottom: 1px solid #cbd8e5;
    padding-bottom: 5px; margin-bottom: 10px;
}
.entry { margin-bottom: 13px; break-inside: avoid; }
h3 { color: #244d70; font-size: 13px; margin: 0; }
.subtitle { font-weight: bold; color: #52677c; }
.meta { color: #7c8996; font-size: 11px; }
.description { white-space: pre-line; margin: 5px 0; }
.source-content { white-space: pre-wrap; overflow-wrap: anywhere; }
.skills { display: flex; flex-wrap: wrap; gap: 7px; }
.skill {
    background: #edf5fc; color: #24577e;
    border: 1px solid #d1e3f1; border-radius: 5px;
    padding: 4px 9px; font-size: 11px;
}
@media print {
    body { background: white; }
    .resume { width: auto; min-height: auto; margin: 0; padding: 0; box-shadow: none; }
}
</style>
</head>
<body>
<div class="resume" data-layout="{{ design_settings.layout }}">
    {% include "resumes/content.html" %}
</div>
</body>
</html>
