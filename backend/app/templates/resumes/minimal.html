<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ resume.title }}</title>
<style>
@page { size: {{ design_settings.page_size }}; margin: 15mm; }
* { box-sizing: border-box; }
body { margin: 0; background: #f5f5f5; color: #111; font: {{ design_settings.font_size }}px/1.45 {{ design_settings.font_family }}, sans-serif; }
.resume {
    display: flex;
    flex-direction: column;
    width: {% if design_settings.page_size == "Letter" %}8.5in{% else %}210mm{% endif %};
    min-height: {% if design_settings.page_size == "Letter" %}11in{% else %}297mm{% endif %};
    margin: 25px auto;
    padding: 17mm; background: white; box-shadow: 0 2px 12px #00000015;
    border-top: 3px solid {{ design_settings.accent_color }};
}
.resume[data-layout="two-column"] {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    column-gap: 24px;
    align-content: start;
}
.resume-header { grid-column: 1 / -1; border-bottom: 1px solid #222; padding-bottom: 10px; }
h1 { font-size: 25px; margin: 0; }
.professional-title { font-size: 13px; margin-top: 3px; }
.contact { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 8px; font-size: 10px; }
a { color: {{ design_settings.accent_color }}; text-decoration: none; }
section { min-width: 0; margin-top: {% if design_settings.spacing == "compact" %}10{% elif design_settings.spacing == "spacious" %}24{% else %}15{% endif %}px; }
h2 {
    font-size: 12px; text-transform: uppercase; letter-spacing: .5px;
    border-bottom: 1px solid #999; padding-bottom: 3px; margin-bottom: 7px;
}
.entry { margin-bottom: 9px; break-inside: avoid; }
h3 { font-size: 12px; margin: 0; }
.subtitle { font-weight: bold; }
.meta { font-size: 10px; color: #555; }
.description { white-space: pre-line; margin: 3px 0; }
.source-content { white-space: pre-wrap; overflow-wrap: anywhere; }
.skills { display: flex; flex-wrap: wrap; gap: 4px 12px; }
.skill { font-size: 11px; }
@media print {
    body { background: white; }
    .resume { width: auto; min-height: auto; margin: 0; padding: 0; box-shadow: none; }
}
</style>
</head>
<body>
<div class="resume" data-layout="{{ design_settings.layout }}">
    {% include "resumes/content.html" %}
</div>
</body>
</html>
